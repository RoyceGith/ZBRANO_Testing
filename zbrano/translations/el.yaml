configuration:
  log_level:
    name: "Λεπτομέρειες αντιμετώπισης προβλημάτων"
    description: "Διατηρήστε την επιλογή Πληροφορίες για κανονική χρήση. Επιλέξτε περισσότερες λεπτομέρειες μόνο κατά τη διάγνωση προβλήματος."
  openai_api_key:
    name: "Κλειδί API OpenAI"
    description: "Απαιτείται για τη συνομιλία ZBRANO και τον προεπιλεγμένο πάροχο φωνής. Το κλειδί παραμένει στην προστατευμένη διαμόρφωση εφαρμογής του Home Assistant."
  chat_provider:
    name: "Πάροχος AI συνομιλίας"
    description: "Επιλέξτε OpenAI ή χρησιμοποιήστε τον δικό σας λογαριασμό OpenRouter για μοντέλα από πολλές εταιρείες AI. Επανεκκινήστε το ZBRANO μετά την αλλαγή."
  openrouter_api_key:
    name: "Κλειδί API OpenRouter"
    description: "Το δικό σας προστατευμένο κλειδί OpenRouter. Απαιτείται μόνο όταν το OpenRouter είναι ο πάροχος AI συνομιλίας."
  openrouter_model:
    name: "Προεπιλεγμένο μοντέλο OpenRouter"
    description: "Πλήρες ID μοντέλου OpenRouter, όπως openai/gpt-5-mini. Μετά μπορείτε να επιλέξετε άλλο διαθέσιμο μοντέλο μέσα στο ZBRANO."
  github_oauth_client_id:
    name: "Αναγνωριστικό σύνδεσης GitHub"
    description: "Προαιρετικό. Προσθέστε το μόνο όταν συνδέετε την επίσημη προσθήκη GitHub."
  google_oauth_client_id:
    name: "Αναγνωριστικό σύνδεσης Google"
    description: "Προαιρετικό. Προσθέστε το μαζί με το αντίστοιχο μυστικό μόνο όταν συνδέετε υπηρεσίες Google."
  google_oauth_client_secret:
    name: "Μυστικό σύνδεσης Google"
    description: "Προαιρετικό προστατευμένο μυστικό που χρησιμοποιείται με το αναγνωριστικό σύνδεσης Google."
  openai_model:
    name: "Μοντέλο συνομιλίας και συλλογισμού"
    description: "Το μοντέλο OpenAI που χρησιμοποιείται για συνομιλίες και αποφάσεις ZBRANO. Διατηρήστε την προεπιλογή εκτός αν γνωρίζετε ποιο μοντέλο θέλετε."
  openai_transcription_model:
    name: "Μοντέλο μετατροπής ομιλίας σε κείμενο"
    description: "Το μοντέλο OpenAI που μετατρέπει τα προφορικά αιτήματα σε κείμενο."
  openai_tts_model:
    name: "Μοντέλο φωνητικών απαντήσεων OpenAI"
    description: "Το μοντέλο OpenAI που εκφωνεί τις απαντήσεις ZBRANO όταν έχει επιλεγεί ο πάροχος OpenAI."
  speech_provider:
    name: "Πάροχος φωνητικών απαντήσεων"
    description: "Επιλέξτε OpenAI για την απλούστερη ρύθμιση ή ElevenLabs αφού προσθέσετε το κλειδί API και το αναγνωριστικό φωνής."
  elevenlabs_api_key:
    name: "Κλειδί API ElevenLabs"
    description: "Προαιρετικό προστατευμένο κλειδί, απαραίτητο μόνο όταν έχει επιλεγεί το ElevenLabs."
  elevenlabs_voice_id:
    name: "Αναγνωριστικό φωνής ElevenLabs"
    description: "Προαιρετικό αναγνωριστικό φωνής που απαιτείται μαζί με κλειδί API ElevenLabs."
  elevenlabs_voice_name:
    name: "Όνομα φωνής ElevenLabs"
    description: "Φιλικό όνομα που εμφανίζεται για τη διαμορφωμένη φωνή ElevenLabs."
  elevenlabs_model_id:
    name: "Μοντέλο φωνής ElevenLabs"
    description: "Το μοντέλο ElevenLabs που χρησιμοποιείται για φωνητικές απαντήσεις. Διατηρήστε την προεπιλογή για γρήγορες απαντήσεις."
  speech_fallback_to_openai:
    name: "Εφεδρική χρήση φωνής OpenAI"
    description: "Χρήση φωνής OpenAI όταν δεν μπορεί να παραχθεί απάντηση μέσω ElevenLabs."
  ha_read_entities:
    name: "Παλαιά αναγνωριστικά συσκευών αισθητήρα"
    description: "Πεδίο συμβατότητας για παλαιότερες εγκαταστάσεις. Αφήστε το κενό και επιλέξτε Συσκευές αισθητήρα από την Πρόσβαση συσκευών μέσα στο ZBRANO."
  ha_control_entities:
    name: "Παλαιά αναγνωριστικά συσκευών ελέγχου"
    description: "Πεδίο συμβατότητας για παλαιότερες εγκαταστάσεις. Αφήστε το κενό και επιλέξτε Συσκευές ελέγχου από την Πρόσβαση συσκευών μέσα στο ZBRANO."
  enable_direct_port:
    name: "Να επιτρέπονται συνδέσεις Assist με σύζευξη"
    description: "Επιτρέπονται μόνο αιτήματα Assist API με κλειδί σύζευξης. Η πρόσβαση από πρόγραμμα περιήγησης απαιτεί Home Assistant. Αντιστοιχίστε τη θύρα 8099 στο Δίκτυο μόνο αν τη χρειάζεται η σύνδεση Assist."
network:
  8099/tcp: "Προαιρετικό Assist API με σύζευξη, χωρίς άμεση πρόσβαση από πρόγραμμα περιήγησης"
