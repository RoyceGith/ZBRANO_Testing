name: "ZBRANO"
description: "Private AI conversation, home intelligence, and visual automation with explicit device permissions"
version: "0.13.252"
slug: "zbrano"
image: "ghcr.io/roycegith/zbrano-core"
init: false
startup: application
stage: experimental
arch:
  - aarch64
  - amd64

homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:robot"
panel_title: "ZBRANO"
panel_admin: true

ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Optional paired Assist API only; no direct browser access"

options:
  log_level: "info"
  openai_api_key: ""
  chat_provider: "openai"
  openrouter_api_key: ""
  openrouter_model: "openai/gpt-5-mini"
  github_oauth_client_id: ""
  google_oauth_client_id: ""
  google_oauth_client_secret: ""
  openai_model: "gpt-5-mini"
  openai_transcription_model: "gpt-4o-transcribe"
  openai_tts_model: "gpt-4o-mini-tts"
  speech_provider: "openai"
  elevenlabs_api_key: ""
  elevenlabs_voice_id: ""
  elevenlabs_voice_name: "ZBRANO"
  elevenlabs_model_id: "eleven_flash_v2_5"
  speech_fallback_to_openai: true
  ha_read_entities: ""
  ha_control_entities: ""
  enable_direct_port: false

schema:
  log_level: "list(trace|debug|info|warning|error)"
  openai_api_key: "password"
  chat_provider: "list(openai|openrouter)"
  openrouter_api_key: "password"
  openrouter_model: "str"
  github_oauth_client_id: "str?"
  google_oauth_client_id: "str?"
  google_oauth_client_secret: "password"
  openai_model: "str"
  openai_transcription_model: "str"
  openai_tts_model: "str"
  speech_provider: "list(openai|elevenlabs)"
  elevenlabs_api_key: "password"
  elevenlabs_voice_id: "str?"
  elevenlabs_voice_name: "str"
  elevenlabs_model_id: "str"
  speech_fallback_to_openai: "bool"
  ha_read_entities: "str?"
  ha_control_entities: "str?"
  enable_direct_port: "bool"

backup: hot
